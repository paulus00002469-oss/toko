}

// ===================== CATATAN KESEHATAN MANDIRI =====================
var HL_PLACE = { RUMAH: '🏠 Rumah', APOTEK: '💊 Apotek', FASKES: '🏥 Fasilitas Kesehatan' };
var HL_GLU = { SEWAKTU: 'Sewaktu', PUASA: 'Puasa', '2JPP': '2 Jam Setelah Makan' };
function hlNum(v, d) { return v === null || v === undefined || v === '' ? '' : String(d ? Math.round(v * 10) / 10 : Math.round(v)).replace('.', ','); }
function hlLv(level, text) { return { level: level, text: text }; } // level: ok | warn | high | crit
/** Interpretasi umum (nilai rujukan dewasa) — bukan diagnosis */
function hlSexOf(r) { return (r && r.sex) || (S.me && S.me.sex) || ''; }
/** Interpretasi memakai standar resmi (dewasa) — panduan, bukan diagnosis.
 *  Setiap item: k=nama, v=nilai, s=status, ref=nilai normal/target, src=sumber */
function hlInterpret(r) {
  var out = [], sex = hlSexOf(r);
  function add(k, v, st, ref, src) { out.push({ k: k, v: v, s: st, ref: ref, src: src }); }
  if (r.sys !== null && r.dia !== null) {
    var s = r.sys, d = r.dia, b;
    if (s > 180 || d > 120) b = hlLv('crit', 'Krisis hipertensi');
    else if (s >= 180 || d >= 110) b = hlLv('high', 'Hipertensi derajat 3');
    else if (s >= 160 || d >= 100) b = hlLv('high', 'Hipertensi derajat 2');
    else if (s >= 140 || d >= 90) b = hlLv('high', 'Hipertensi derajat 1');
    else if (s >= 130 || d >= 85) b = hlLv('warn', 'Normal-tinggi');
    else if (s < 90 || d < 60) b = hlLv('warn', 'Rendah');
    else if (s >= 120 || d >= 80) b = hlLv('ok', 'Normal');
    else b = hlLv('ok', 'Optimal');
    add('Tekanan Darah', s + '/' + d + ' mmHg', b, 'Optimal < 120/80 • Normal < 130/85 • Hipertensi ≥ 140/90', 'PERHI 2019');

function rtSave() {
  var e = S.rtEdit || {}, times = rtReadTimes();
  var d = { id: e.id || '', name: val('rt-name'), productId: S.rtProduct || '', unit: val('rt-unit'), dose: val('rt-dose'), times: times,
    rule: hlSegVal('#rt-rule') || 'SESUDAH', stock: val('rt-stock'), remindDays: Number(val('rt-remind')) || 5, note: val('rt-note'),
    status: $('rt-stop') && $('rt-stop').checked ? 'BERHENTI' : 'AKTIF' };
  if (d.name.length < 2) { toast('Isi nama obat', 'err'); $('rt-name').focus(); return; }
  if (!times.length) { toast('Isi jam minum', 'err'); return; }
  if (d.stock === '') { toast('Isi sisa obat sekarang', 'err'); $('rt-stock').focus(); return; }
  d.stockChanged = !e.id || Math.abs(Number(d.stock) - Number(e.stockNow)) > 0.001;
  setBusy('rt-save', true, 'Menyimpan...');
  call('saveRoutineMed', [S.token, d], function (res) {
    setBusy('rt-save', false);
    if (!res || !res.success) { toast((res && res.error) || 'Gagal menyimpan', 'err'); return; }
    S.rt = (S.rt || []).filter(function (x) { return x.id !== res.med.id; }).concat([res.med]);
    S.rtMode = 'list'; S.rtEdit = null;
    toast('✅ Obat rutin tersimpan'); renderRutin(); rtHome(); window.scrollTo(0, 0);

}
function rtDelete(id) {

function rtAddStock(id) {

function rtOrderNeed() {

function rtOrderCalc() {

  if (p && !p.rx) {

    t += '<small>Dimasukkan ke keranjang: <b>' + q + ' ' + esc(u.short) + '</b>' + (u.base > 1 ? ' (isi ' + u.base + ' ' + esc(p.unit) + ')' : '') + (p.stock <= 0 ? ' — ⚠️ stok toko sedang habis' : '') + '</small>';

function rtOrderGo() {
  var n = rtOrderNeed(), p = S.map[n.o.productId];

    if (p.stock <= 0) { toast('Stok di toko sedang habis. Coba tanyakan via WhatsApp.', 'err'); return; }
    var unit = p.big ? 'BESAR' : 'KECIL', q = Math.ceil(n.qty / unitInfo(p, unit).base);
    var line = findLine(p.id, unit);
    addToCart(p.id, unit, Math.max(0, q - (line ? line.qty : 0)));

    toast('Setelah obat diterima, tekan ➕ Stok di Obat Rutin agar perhitungan sisa tetap tepat.');

    S.rxPrefill = 'Isi ulang obat rutin: ' + n.o.name + ' — ' + rtNum(n.o.dose) + ' ' + n.o.unit + ' × ' + n.o.times.length + '/hari (' + RT_RULE[n.o.rule] + '), perlu ± ' + n.qty + ' ' + n.o.unit + ' untuk ' + n.days + ' hari.';
    closeSheet(); showView('resep');

// ---- alarm (Google Calendar, berulang harian) ----
function rtCalUrl(o, t) {
  var d = new Date(), hm = t.split(':');
  d.setHours(+hm[0], +hm[1], 0, 0);
  if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
  var p = function (n) { return ('0' + n).slice(-2); };
  var s = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + 'T' + p(d.getHours()) + p(d.getMinutes()) + '00';
  var e2 = new Date(d.getTime() + 10 * 60000);
  var e = e2.getFullYear() + p(e2.getMonth() + 1) + p(e2.getDate()) + 'T' + p(e2.getHours()) + p(e2.getMinutes()) + '00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('💊 Minum ' + o.name + ' ' + rtNum(o.dose) + ' ' + o.unit) +
    '&dates=' + s + '/' + e + '&ctz=Asia%2FJakarta&recur=' + encodeURIComponent('RRULE:FREQ=DAILY') +
    '&details=' + encodeURIComponent((RT_RULE[o.rule] || '') + '. Pengingat dari ' + (S.cfg.name || 'apotek') + '. Tandai sudah diminum di aplikasi agar stok terhitung.');
}
function rtAlarm(id, afterSave) {
  var o = rtFind(id); if (!o) return;
  $('sheet-body').innerHTML = '<h2 style="font-size:18px;font-weight:800">⏰ Pasang Alarm Minum Obat</h2>' +
    '<p style="font-size:12.5px;color:var(--ink-2);margin:4px 0 12px">' + (afterSave ? 'Tersimpan! ' : '') + 'Agar HP berbunyi setiap hari walau aplikasi tertutup, tambahkan ke <b>Google Calendar</b>. Tekan tiap jam di bawah, lalu tekan <b>Simpan</b> di Google Calendar.</p>' +
    o.times.map(function (t) { return '<a class="btn btn-ghost" target="_blank" rel="noopener" href="' + rtCalUrl(o, t) + '">📅 Alarm jam ' + t.replace(':', '.') + ' — ' + esc(o.name) + '</a>'; }).join('') +
    '<button class="btn btn-ghost" onclick="closeSheet()">' + (afterSave ? 'Nanti saja' : 'Tutup') + '</button>';
  $('sheet').classList.add('open'); $('sheet-bg').classList.add('open');
}

// ===================== WISHLIST & KABARI STOK =====================
function wishOf(id) { return (S.wish || {})[id] || null; }
function loadWishlist(cb) {
  if (!S.token) return;
  call('getWishlist', [S.token], function (res) {
    if (!res || !res.success) return;
    S.wish = {};
    (res.items || []).forEach(function (o) { S.wish[o.productId] = o; });
    refreshHearts();
    var ready = wlReady();
    if (ready.length && !S.wishToastShown) {
      S.wishToastShown = true;
      toast('🔔 ' + ready.length + ' produk yang Anda tunggu sudah tersedia lagi!');
    }
    if (S.view === 'wishlist') renderWishlist();
    if (cb) cb();
  });
}
/** produk yang diminta "kabari" dan sekarang stoknya ada */
function wlReady() {
  return Object.keys(S.wish || {}).filter(function (id) { var w = S.wish[id], p = S.map[id]; return w.notify && p && p.stock > 0; });
}
function heartHTML(p) {
  var w = wishOf(p.id);
  return '<button class="heart' + (w && w.fav ? ' on' : '') + '" id="heart-' + p.id + '" aria-label="Simpan ke wishlist" onclick="event.stopPropagation();toggleFav(\'' + p.id + '\')">' + (w && w.fav ? '♥' : '♡') + '</button>';
}
function refreshHearts() {
  Array.prototype.forEach.call(document.querySelectorAll('.heart[id^="heart-"]'), function (b) {
    var id = b.id.slice(6), w = wishOf(id);
    b.classList.toggle('on', !!(w && w.fav)); b.textContent = w && w.fav ? '♥' : '♡';
  });
}
function wishSet(id, field, on, done) {
  if (!S.token) { requireLogin(S.view); return; }
  var p = S.map[id]; if (!p) return;
  var w = S.wish && S.wish[id] ? S.wish[id] : { productId: id, name: p.name, fav: false, notify: false, notified: false };
  var prev = w[field];
  w[field] = on; if (field === 'notify' && on) w.notified = false;
  S.wish = S.wish || {}; S.wish[id] = w;
  refreshHearts(); if (S.sheet && S.sheet.id === id) renderSheet(); if (S.view === 'wishlist') renderWishlist();
  call('toggleWish', [S.token, id, field, on], function (res) {
    if (!res || !res.success) { w[field] = prev; refreshHearts(); if (S.sheet && S.sheet.id === id) renderSheet(); toast((res && res.error) || 'Gagal menyimpan', 'err'); return; }
    if (done) done();
  });
}
function toggleFav(id) {
  var w = wishOf(id), on = !(w && w.fav);
  wishSet(id, 'fav', on, function () { toast(on ? '♥ Disimpan ke Wishlist' : 'Dihapus dari Wishlist'); });
}
function toggleNotify(id) {
  var w = wishOf(id), on = !(w && w.notify);
  wishSet(id, 'notify', on, function () { toast(on ? '🔔 Kami kabari lewat WhatsApp/aplikasi saat stok tersedia' : 'Pengingat stok dibatalkan'); });
}

  var nFav = Object.keys(S.wish).filter(function (id) { return S.wish[id].fav; }).length;

  }).join('');
  v.innerHTML = '<div class="hl-hero wl-hero"><div><b>♥ Wishlist Saya</b><small>Simpan produk favorit untuk dibeli lagi, dan minta dikabari saat produk yang habis tersedia kembali.</small></div></div>' +
