<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#5a189a">
<title>Apotek JOJO SATU</title>
<meta name="description" content="Pesan obat, tebus resep & kumpulkan poin di Apotek JOJO SATU">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JOJO SATU">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --brand:#7b2cbf;--brand-2:#a855f7;--brand-d:#5a189a;--brand-soft:#f3e8ff;--jojo-blue:#1d5fae;--jojo-red:#c0394f;
  --accent:#ff8a00;--accent-soft:#fff3e3;--red:#e5484d;--red-soft:#fdecec;--blue:#2563eb;--blue-soft:#eaf1ff;
  --ink:#14212b;--ink-2:#4b5a66;--muted:#8a97a3;--line:#ebe5f3;--bg:#f6f2fb;--card:#fff;
  --r:14px;--shadow:0 2px 10px rgba(16,33,43,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);overflow-x:hidden;width:100%;touch-action:manipulation;overscroll-behavior-y:contain}
img,svg{max-width:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:14px;line-height:1.45}
#app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--brand)}

/* HEADER */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#3c096c 0%,#7b2cbf 55%,#c026d3 100%);color:#fff;padding:14px 16px 14px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(123,44,191,.25)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:4px}
.brand b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;opacity:.92;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);font-size:18px;flex-shrink:0;position:relative}
.back-btn{display:none;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);font-size:18px;flex-shrink:0}
body:not(.home) .back-btn{display:grid;place-items:center}
body:not(.home) .logo{display:none}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:13px;padding:0 12px;height:46px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.search input{flex:1;border:none;outline:none;background:none;height:100%;min-width:0}
.search .clear{display:none;color:var(--muted);font-size:16px;padding:6px}
.search.has .clear{display:block}
.mode{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);border-radius:13px;padding:10px 12px;min-height:46px;text-align:left;color:#fff;display:flex;gap:9px;align-items:center;transition:.15s}
.mode button .ic{font-size:20px}
.mode button b{display:block;font-size:13px;line-height:1.2}
.mode button small{font-size:11px;opacity:.9}
.mode button.active{background:#fff;color:var(--brand-d);border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12)}
body:not(.home) .search,body:not(.home) .mode{display:none}

/* LAYOUT */
.view{display:none;padding:14px 14px 0;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec-head h2{font-size:17px;font-weight:800}
.sec-head span,.sec-head a{font-size:12.5px;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:800;margin-bottom:10px}

/* BANNER */
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
.banners::-webkit-scrollbar{display:none}
.banner{flex:0 0 86%;scroll-snap-align:center;border-radius:16px;padding:16px 16px 14px;color:#fff;min-height:122px;position:relative;overflow:hidden;cursor:pointer}
.banner b{display:block;font-size:18px;font-weight:800;line-height:1.2;max-width:72%}
.banner p{font-size:12.5px;opacity:.95;margin-top:6px;max-width:70%}
.banner .big{position:absolute;right:10px;bottom:4px;font-size:58px;opacity:.95}
.banner .pill{display:inline-block;margin-top:10px;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.b1{background:linear-gradient(135deg,#7c3aed,#c026d3)}
.b2{background:linear-gradient(135deg,#ff8a00,#f43f5e)}
.b3{background:linear-gradient(135deg,var(--jojo-blue),#7b2cbf)}
.b5{background:linear-gradient(135deg,#0e9f8e,#2563eb)}
.b6{background:linear-gradient(135deg,#db2777,#7b2cbf)}
.b7{background:linear-gradient(135deg,#f59e0b,#db2777)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:6px;background:#c7d2d9;transition:.2s}
.dots i.on{width:18px;background:var(--brand)}

/* CATEGORIES */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:#fff;border-radius:14px;padding:10px 4px 9px;text-align:center;box-shadow:var(--shadow);border:1.5px solid transparent;transition:.15s}
.cat .ci{width:42px;height:42px;margin:0 auto 6px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.cat span{display:block;font-size:11px;font-weight:700;line-height:1.2;color:var(--ink-2)}
.cat.active{border-color:var(--brand);background:var(--brand-soft)}
.cat.active span{color:var(--brand-d)}
.cat.rx .ci{background:var(--accent-soft)}

/* PRODUCTS */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pcard.out{opacity:.62}
.pimg{aspect-ratio:1/1;background:#f6f8fa;position:relative;display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .ph{width:64%;aspect-ratio:1/1;border-radius:18px;display:grid;place-items:center;font-size:40px}
.tag{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px}
.tag.rx{background:var(--accent);color:#fff}
.pbody{padding:9px 10px 10px;display:flex;flex-direction:column;flex:1}
.pname{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.punit{font-size:11px;color:var(--muted);margin-top:2px}
.pprice{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px}
.pstock{font-size:11px;font-weight:700;margin-top:2px}
.pstock.low{color:var(--accent)}
.pstock.out{color:var(--red)}
.pact{margin-top:auto;padding-top:8px}
.btn-add{width:100%;height:34px;border-radius:10px;border:1.5px solid var(--brand);color:var(--brand);font-weight:800;font-size:12.5px;background:#fff}
.btn-add:disabled{border-color:var(--line);color:var(--muted)}
.step{display:flex;align-items:center;justify-content:space-between;height:34px;border-radius:10px;background:var(--brand);color:#fff;overflow:hidden}
.step button{width:36px;height:100%;color:#fff;font-size:18px;font-weight:800}
.step span{font-weight:800;font-size:14px}
.more{display:block;width:100%;margin:12px 0 4px;height:42px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700;color:var(--ink-2)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .e{font-size:48px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.skel{background:linear-gradient(90deg,#eef2f4 25%,#f7f9fa 50%,#eef2f4 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);height:250px}
@keyframes sk{to{background-position:-200% 0}}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;position:relative}
.bnav button .ic{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
.bnav button.active{color:var(--brand)}
.bnav button.active .ic{filter:none;opacity:1}
.bnav .mid .ic{width:48px;height:48px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;filter:none;opacity:1;font-size:22px;box-shadow:0 4px 12px rgba(123,44,191,.35);border:3px solid #fff}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center}
.badge.show{display:flex}

/* FORMS */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;background:#fff;transition:.15s}
.field textarea{resize:vertical;min-height:76px}
.field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(123,44,191,.12)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:#fff}
.seg button b{display:block;font-size:13.5px}
.seg button small{font-size:11.5px;color:var(--muted)}
.seg button.active{border-color:var(--brand);background:var(--brand-soft)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.radio input{margin-top:3px;accent-color:var(--brand);width:18px;height:18px}
.radio b{display:block;font-size:13.5px}
.radio small{color:var(--muted);font-size:12px}
.radio.active{border-color:var(--brand);background:var(--brand-soft)}
.link-btn{font-size:12.5px;font-weight:700;color:var(--brand);padding:4px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:13px;font-weight:800;font-size:15px}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 4px 14px rgba(123,44,191,.3)}
.btn-primary:disabled{opacity:.6}
.btn-wa{background:#25d366;color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.btn+.btn{margin-top:8px}
.alert{border-radius:12px;padding:11px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px;display:flex;gap:9px}
.alert.warn{background:var(--accent-soft);color:#8a4b00}
.alert.info{background:var(--blue-soft);color:#1d3f8f}
.alert.ok{background:var(--brand-soft);color:var(--brand-d)}

/* UPLOAD RESEP */
.upload{border:2px dashed #d0b4f0;border-radius:14px;padding:16px;text-align:center;background:#faf6ff}
.upload .e{font-size:34px}
.upload b{display:block;margin:4px 0 2px}
.upload small{color:var(--muted);font-size:12px}
.upload .row{display:flex;gap:8px;margin-top:12px}
.upload .row button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:13px;background:#fff;border:1.5px solid var(--brand);color:var(--brand)}
.upload .row button.solid{background:var(--brand);color:#fff}
.upload-prev{display:flex;gap:12px;align-items:center;text-align:left}
.upload-prev img{width:76px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.steps3 div{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.steps3 div i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.rt-strip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;margin-bottom:12px;cursor:pointer;border-left:4px solid #db2777}
.rt-si{font-size:26px}.rt-st{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2)}.rt-st b{display:block;font-size:14px;color:var(--ink)}.rt-st span{display:block}
.rt-miss{color:#b45309;font-weight:700}.rt-ref{color:#b42318;font-weight:700}.rt-sa{font-size:22px;color:var(--muted)}
.hl-hero.rt-hero{background:linear-gradient(135deg,#db2777,#7b2cbf)}
.rt-slot{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #ece6f3;cursor:pointer}.rt-slot:last-child{border-bottom:0}
.rt-slot input{width:22px;height:22px;accent-color:var(--brand);flex:none}.rt-time{font-weight:800;font-size:15px;min-width:48px}
.rt-sn{flex:1;min-width:0}.rt-sn b{display:block;font-size:13.5px}.rt-sn small{font-size:11.5px;color:var(--muted)}
.rt-sx{font-size:11px;font-weight:800;color:var(--muted)}.rt-slot.done .rt-sn b{text-decoration:line-through;color:var(--muted)}.rt-slot.done .rt-sx{color:#0b7a55}.rt-slot.late .rt-sx{color:#b45309}
.rt-card{border-left:4px solid #0b8f6a}.rt-card.warn{border-left-color:#f59e0b}.rt-card.crit{border-left-color:#e5484d}.rt-card.off{border-left-color:#cbd5e1;opacity:.75}
.rt-bar{height:8px;background:#efe9f6;border-radius:99px;overflow:hidden;margin:4px 0 6px}.rt-bar i{display:block;height:100%;background:linear-gradient(90deg,#0b8f6a,#34d399);border-radius:99px}
.rt-card.warn .rt-bar i{background:#f59e0b}.rt-card.crit .rt-bar i{background:#e5484d}
.rt-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.rt-acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;margin-top:10px}.rt-acts .btn{height:40px;font-size:12.5px;margin:0;padding:0 6px}
.rt-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.rt-presets button{border:1.5px solid #e2d8ef;background:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--brand-d)}
.rt-trow{display:flex;align-items:center;gap:8px;margin-bottom:8px}.rt-trow span{font-size:12.5px;color:var(--ink-2);min-width:76px}.rt-trow input{flex:1;height:44px;border:1.5px solid #e2d8ef;border-radius:10px;padding:0 10px;font-size:15px}
.rt-trow button{width:36px;height:36px;border-radius:10px;background:#fdecec;color:#b42318;font-weight:800}
.rt-hint{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}.rt-chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}.rt-chk input{width:18px;height:18px;accent-color:var(--brand)}
.heart{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:17px;line-height:32px;text-align:center;color:#94a3b8;z-index:2}
.heart.on{color:#e11d48}
.sh-fav{flex:none;border:1.5px solid #f3c4d0;background:#fff;color:#e11d48;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:800}.sh-fav.on{background:#ffe4ec}
.qgrid button{position:relative}.qdot{position:absolute;top:6px;right:10px;background:#e11d48;color:#fff;font-style:normal;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 6px}
.hl-hero.wl-hero{background:linear-gradient(135deg,#e11d48,#7b2cbf)}.hl-hero.aj-hero{background:linear-gradient(135deg,#f59e0b,#db2777)}
.wl-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed #ece6f3}.wl-row:last-child{border-bottom:0}.wl-row.off{opacity:.6}
.wl-img{width:56px;height:56px;border-radius:12px;background:#f6f1fc;display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none;cursor:pointer}.wl-img img{width:100%;height:100%;object-fit:cover}
.wl-b{flex:1;min-width:0;cursor:pointer}.wl-b b{display:block;font-size:13.5px;line-height:1.3}.wl-st{display:block;font-size:11.5px;font-weight:700;margin-top:3px}.wl-st.ok{color:#0b7a55}.wl-st.no{color:#b45309}
.wl-a{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.wl-a .btn-add{height:34px;padding:0 10px;font-size:12px}
.aj-code{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--brand-d);background:#f6f1fc;border:2px dashed #c9a7ee;border-radius:14px;padding:10px;margin:8px 0 12px;font-family:monospace}
.aj-btns .btn{margin-bottom:8px}.aj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.aj-stats div{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;text-align:center}.aj-stats b{display:block;font-size:22px;color:var(--brand-d)}.aj-stats small{font-size:11px;color:var(--muted)}
.aj-f{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #ece6f3}.aj-f:last-child{border-bottom:0}.aj-f div{flex:1}.aj-f b{display:block;font-size:13.5px}.aj-f small{font-size:11.5px;color:var(--muted)}
.rv-cta{height:42px;font-size:13.5px;margin-top:8px;color:#b45309;border-color:#fcd9a8}
.rv-box{background:#fffaf0;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}.rv-stars{color:#f59e0b;font-size:17px;letter-spacing:1px}
.rv-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.rv-tags span{font-size:11px;background:#fff;border:1px solid #fde4b8;border-radius:99px;padding:2px 8px;color:#8a5a00}
.rv-c{margin-top:6px;color:var(--ink-2);font-style:italic}.rv-reply{margin-top:8px;background:var(--brand-soft);color:var(--brand-d);border-radius:10px;padding:8px 10px;font-size:12.5px}
.rv-pick{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}.rv-pick button{font-size:40px;line-height:1;color:#d6d3e0;background:none}.rv-pick button.on{color:#f59e0b}
.rv-lbl{text-align:center;font-weight:800;font-size:14px;color:var(--ink-2);margin-bottom:12px}
.rv-chips{display:flex;flex-wrap:wrap;gap:6px}.rv-chips button{border:1.5px solid #e2d8ef;background:#fff;border-radius:99px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2)}.rv-chips button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d)}
#install-bar{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:10px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(60,20,110,.25);padding:10px 10px 10px 12px;max-width:520px;margin:0 auto}
#install-bar.show{display:flex;animation:ibIn .35s ease}
@keyframes ibIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
#install-bar img{width:42px;height:42px;border-radius:10px;flex:none}#install-bar div{flex:1;min-width:0}#install-bar b{display:block;font-size:13.5px}#install-bar small{font-size:11.5px;color:var(--muted)}
#install-bar .ib-go{background:var(--brand);color:#fff;font-weight:800;border-radius:10px;padding:9px 14px;font-size:13px}#install-bar .ib-x{color:var(--muted);font-size:16px;padding:6px}
.ib-steps{margin:10px 0 14px 18px;font-size:14px;line-height:1.7}.ib-ic{display:inline-block;background:#f3eefa;border-radius:6px;padding:0 5px}
.hl-hero{background:linear-gradient(135deg,#5a189a,#9d4edd);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hl-hero b{font-size:18px;display:block;margin-bottom:4px}.hl-hero small b{display:inline;font-size:inherit;margin:0}.hl-hero small{font-size:12.5px;opacity:.92;line-height:1.45;display:block}
.hl-actions{margin-bottom:6px}.hl-act2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.hl-act2 .btn{height:44px;font-size:13px;margin:0}
.hlrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #ece6f3;font-size:13px}.hlrow:last-of-type{border-bottom:0}
.hlrl{flex:1;min-width:0;color:var(--ink-2)}.hlrl span{display:block}.hlrv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}.hlrow b{font-weight:800;white-space:nowrap}
.hlref{display:block;font-size:10.5px;color:#0b7a55;margin-top:2px;line-height:1.35}.hlref i{color:var(--muted);font-style:normal}
.hlreft{background:#faf7fd;border-radius:12px;padding:10px 12px;margin-bottom:10px}.hlreft>b{display:block;font-size:13.5px;margin-bottom:6px}.hlreft>small{display:block;font-size:10.5px;color:var(--muted);margin-top:6px}
.hlrr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}.hlrr .hlb{white-space:normal;text-align:right}
.hlb{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.hlb.ok{background:#e3f6ee;color:#0b7a55}.hlb.warn{background:#fff3d6;color:#8a5a00}.hlb.high{background:#fde4e4;color:#b42318}.hlb.crit{background:#b42318;color:#fff}
.hlmeta{font-size:12px;color:var(--muted);margin-top:8px}
.hlcard{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.hlch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}.hlch b{font-size:13.5px;display:block}.hlch small{font-size:11.5px;color:var(--muted)}
.hlchips{display:flex;flex-wrap:wrap;gap:6px}
.hlchip{font-size:12px;font-weight:800;padding:5px 9px;border-radius:10px;background:#f3eefa;color:var(--ink)}
.hlchip small{display:block;font-size:9.5px;font-weight:600;color:var(--muted)}
.hlchip.ok{background:#e9f8f1}.hlchip.warn{background:#fff6e0}.hlchip.high,.hlchip.crit{background:#fdecec}
.hlchart{padding:12px}.hlct{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px;flex-wrap:wrap}.hlct span{color:var(--muted);font-size:11px}
.hlct i{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 3px 0 6px}.hlsvg{width:100%;height:auto;display:block;margin-top:6px}
.hlseg{display:flex;gap:6px;flex-wrap:wrap}.hlseg button{flex:1;min-width:90px;border:1.5px solid #e2d8ef;background:#fff;border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.hlseg button.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d)}
.hlg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hlg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hlg3 .field,.hlg2 .field{margin-bottom:6px}.hlg3 label small,.hlg2 label small{font-weight:500;color:var(--muted)}
.hlbmi{background:#f6f1fc;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:4px}.hlbmi small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.cat.hl .ci{background:linear-gradient(135deg,#ffe3ec,#ffd0e0)}
@media(max-width:360px){.hlg3{grid-template-columns:1fr 1fr}}
.hero-rx{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero-rx b{font-size:18px;display:block}
.hero-rx p{font-size:12.5px;opacity:.95;margin-top:4px}

/* CART */
.cline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:none}
.cline .th{width:60px;height:60px;border-radius:11px;background:#f6f8fa;display:grid;place-items:center;font-size:26px;overflow:hidden;flex-shrink:0}
.cline .th img{width:100%;height:100%;object-fit:cover}
.cline .inf{flex:1;min-width:0}
.cline .nm{font-size:13.5px;font-weight:700;line-height:1.3}
.cline .un{font-size:11.5px;color:var(--muted)}
.cline .pr{font-weight:800;margin-top:3px}
.cline .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;height:32px}
.qty button{width:32px;height:100%;font-size:17px;font-weight:800;color:var(--brand)}
.qty span{min-width:26px;text-align:center;font-weight:800}
.del{font-size:12px;color:var(--red);font-weight:700}
.sum-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;color:var(--ink-2)}
.sum-row.total{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;font-size:16px;font-weight:800;color:var(--ink)}
.freebar{height:7px;background:#e8eef1;border-radius:7px;overflow:hidden;margin-top:6px}
.freebar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:7px}
.sticky-cta{position:sticky;bottom:78px;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 6px;margin-top:4px}

/* ORDERS */
.ocard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ohead b{font-size:14px}
.ohead small{display:block;color:var(--muted);font-size:11.5px}
.spill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.odesc{font-size:12.5px;color:var(--ink-2);margin:8px 0}
.tline{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0 6px;position:relative}
.tline div{text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;position:relative}
.tline div i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 4px;background:#e3e9ed;font-style:normal;font-size:11px;line-height:22px;color:#fff;position:relative;z-index:1}
.tline div::before{content:'';position:absolute;top:10px;left:-50%;width:100%;height:3px;background:#e3e9ed}
.tline div:first-child::before{display:none}
.tline div.on{color:var(--brand-d)}
.tline div.on i{background:var(--brand)}
.tline div.on::before{background:var(--brand)}
.oitems{font-size:12.5px;color:var(--ink-2);background:#f7f9fa;border-radius:10px;padding:9px 10px;margin:8px 0}
.onote{font-size:12.5px;background:var(--accent-soft);color:#8a4b00;border-radius:10px;padding:9px 10px;margin:8px 0}

/* SHEET */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;z-index:61;max-height:90vh;overflow-y:auto;transition:transform .25s ease;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.open{transform:translate(-50%,0)}
.sheet.open+.sheet-bg,.sheet-bg.open{opacity:1;pointer-events:auto}
.grab{width:42px;height:5px;border-radius:5px;background:#d6dde2;margin:0 auto 12px}
.sh-img{height:220px;border-radius:16px;background:#f6f8fa;display:grid;place-items:center;overflow:hidden;font-size:80px}
.sh-img img{width:100%;height:100%;object-fit:contain}
.units{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.units button{border:1.5px solid var(--line);border-radius:11px;padding:8px 12px;text-align:left;background:#fff}
.units button b{display:block;font-size:13px}
.units button small{font-size:12px;color:var(--muted)}
.units button.active{border-color:var(--brand);background:var(--brand-soft)}


/* MEMBER */
.pts-chip{height:36px;padding:0 12px;border-radius:18px;background:rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:13px;white-space:nowrap;flex-shrink:0}
.top-actions{display:flex;gap:8px;align-items:center}
.mcard{position:relative;border-radius:18px;padding:16px 18px 12px;color:#fff;overflow:hidden;cursor:pointer;margin-bottom:12px;
  background:linear-gradient(135deg,#3c096c 0%,#7b2cbf 50%,#c026d3 100%);box-shadow:0 10px 26px rgba(123,44,191,.35)}
.mcard::after{content:'';position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.mc-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;letter-spacing:.6px;opacity:.95}
.mc-name{font-size:18px;font-weight:800;margin-top:8px;position:relative;z-index:1}
.mc-pts{font-size:13px;opacity:.95;margin-top:2px}
.mc-pts b{font-size:22px}
.mc-bc{background:#fff;border-radius:10px;padding:6px 6px 2px;margin-top:10px;text-align:center;position:relative;z-index:1}
.mc-bc svg{width:100%;height:64px}
.mc-tap{text-align:center;font-size:10.5px;opacity:.85;margin-top:6px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qgrid button{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 4px;font-size:12px;font-weight:700;color:var(--ink-2)}
.qgrid button span{display:block;font-size:22px;margin-bottom:4px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-of-type{border-bottom:none}
.hrow b{display:block;font-size:13px}
.hrow small{font-size:11.5px;color:var(--muted)}
.hrow .plus{color:var(--brand);font-weight:800}
.hrow .min{color:var(--red);font-weight:800}
.tagst{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:#eef2f4;color:var(--ink-2)}
.pts-hero{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:6px}
.pts-hero small{font-size:12px;opacity:.9}
.pts-hero b{display:block;font-size:40px;font-weight:800;line-height:1.1;margin:4px 0}
.pts-hero span{font-size:12px;opacity:.95}
.vcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px;cursor:pointer;border-left:5px solid #7c3aed}
.vcard .vl{font-size:26px}
.vcard .vm{flex:1;min-width:0}
.vcard .vm b{display:block;font-size:13.5px}
.vcard .vm small{font-size:11.5px;color:var(--muted);font-family:monospace}
.vcard .vr{font-size:12px;font-weight:800;color:#7c3aed}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column}
.rcard .ri{font-size:28px}
.rcard b{font-size:13.5px;margin-top:4px;line-height:1.3}
.rcard small{font-size:11.5px;color:var(--muted)}
.rcard .rp{font-weight:800;color:#7c3aed;margin-top:6px}
.rcard .btn-add{margin-top:auto}
.b4{background:linear-gradient(135deg,#5a189a,#9d4edd 60%,#e0aaff)}


/* ===== RESPONSIF: penuh di semua ukuran layar ===== */
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.view{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
/* kelas ukuran diatur oleh skrip fit() berdasarkan lebar efektif layar */
body.w-sm{font-size:13px}
body.w-sm .cats{grid-template-columns:repeat(3,1fr)}
body.w-sm .mode button small{display:none}
body.w-sm .bnav button{font-size:10px}
body.w-sm .grid{gap:8px}
body.w-lg #app,body.w-lg .bnav{max-width:1100px}
body.w-lg .sheet{max-width:640px}
body.w-lg .top{border-radius:0 0 26px 26px}
body.w-lg .search,body.w-lg .mode{max-width:760px;margin-left:auto;margin-right:auto}
body.w-lg .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
body.w-lg .cats{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
body.w-lg .rgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
body.w-lg .banner{flex-basis:calc(50% - 5px)}
body.w-xl .banner{flex-basis:calc(33.333% - 7px)}
body.w-lg #view-cart,body.w-lg #view-checkout,body.w-lg #view-resep,body.w-lg #view-sehat,body.w-lg #view-rutin,body.w-lg #view-orders,body.w-lg #view-akun,body.w-lg #view-poin,body.w-lg #view-auth,body.w-lg #view-success{max-width:760px;margin:0 auto}
body.w-lg .mcard{max-width:480px;margin-left:auto;margin-right:auto}
body.pf-scaled #app,body.pf-scaled .bnav,body.pf-scaled .sheet{max-width:none}

.logo .lg-icon{width:100%;height:100%}
.brandhero{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow);border:1.5px solid #eadcf8;position:relative;overflow:hidden}
.brandhero::after{content:'';position:absolute;right:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#f3e8ff 0%,transparent 70%)}
.brandhero .lg-full{width:64px;height:100px;flex-shrink:0;position:relative;z-index:1}
.brandhero .bt{position:relative;z-index:1;min-width:0}
.brandhero .bt small{display:block;font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--jojo-red);text-transform:uppercase}
.brandhero .bt b{display:block;font-size:19px;font-weight:800;line-height:1.2;margin-top:2px;background:linear-gradient(90deg,#5a189a,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandhero .bt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.brandfoot{text-align:center;padding:26px 10px 10px;color:var(--ink-2)}
.brandfoot .lg-full{width:70px;height:110px;margin:0 auto 8px}
.brandfoot b{display:block;font-size:15px;color:var(--brand-d)}
.brandfoot small{font-size:12px;color:var(--muted)}
.mc-logo{width:30px;height:34px;background-color:#fff;border-radius:8px;background-size:78%;margin-right:8px;flex-shrink:0}
.mc-top .mcl{display:flex;align-items:center}
.authlogo{text-align:center;margin:4px 0 14px}

<script>
/* Paskan tampilan ke lebar layar HP.
   Jika browser HP membuka halaman dalam "mode desktop" (lebar ~980px sehingga semua tampak kecil),
   halaman otomatis diperbesar agar penuh & presisi selebar layar. */
(function () {
  function fit() {
    var de = document.documentElement, b = document.body;
    de.style.zoom = '';
    var vw = window.innerWidth || de.clientWidth;
    var sw = Math.min(screen.width || vw, screen.height || vw);
    if (window.matchMedia && matchMedia('(orientation: landscape)').matches) sw = Math.max(screen.width || vw, screen.height || vw);
    var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    var z = 1;
    if (touch && sw > 0 && vw > sw * 1.15) { z = vw / sw; de.style.zoom = z; }
    if (!b) return;
    var ew = vw / z;
    b.classList.toggle('pf-scaled', z !== 1);
    b.classList.toggle('w-sm', ew <= 360);
    b.classList.toggle('w-lg', ew >= 700);
    b.classList.toggle('w-xl', ew >= 1000);
  }
  window.__pfFit = fit;
  fit();
  document.addEventListener('DOMContentLoaded', fit);
  window.addEventListener('resize', function () { clearTimeout(window.__pfFitT); window.__pfFitT = setTimeout(fit, 120); });
  window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
})();
</script>

<script>
var API_URL = (window.TOKO_API_URL && /^https:\/\/script\.google\.com\/.+\/exec$/.test(String(window.TOKO_API_URL).trim())) ? String(window.TOKO_API_URL).trim() : '';
var isGAS = false;
var CAT_ORDER = ['Obat Bebas & Umum', 'Obat Bebas Terbatas', 'Vitamin & Suplemen', 'Obat Resep', 'Alat Kesehatan', 'Perawatan Diri'];
var CAT_ICON = { 'Semua': '🛍️', 'Obat Bebas & Umum': '💊', 'Obat Bebas Terbatas': '🌡️', 'Vitamin & Suplemen': '🍊', 'Obat Resep': '📋', 'Alat Kesehatan': '🩺', 'Perawatan Diri': '🧴' };
var CAT_BG = { 'Semua': '#e6f6f0', 'Obat Bebas & Umum': '#eaf1ff', 'Obat Bebas Terbatas': '#fdecec', 'Vitamin & Suplemen': '#fff3e3', 'Obat Resep': '#f3e8ff', 'Alat Kesehatan': '#e0f7fa', 'Perawatan Diri': '#fce7f3' };
var STATUS = {
  'BARU': { label: 'Pesanan Diterima', desc: 'Menunggu konfirmasi apoteker.', color: '#2563eb', rank: 0 },
  'MENUNGGU KONFIRMASI': { label: 'Menunggu Persetujuan Anda', desc: 'Apotek sudah menghitung harga. Silakan SETUJUI agar segera disiapkan, atau BATALKAN pesanan.', color: '#d97706', rank: 0 },
  'DIKONFIRMASI': { label: 'Dikonfirmasi', desc: 'Pesanan dikonfirmasi apotek dan segera disiapkan.', color: '#0891b2', rank: 1 },
  'DIPROSES': { label: 'Sedang Disiapkan', desc: 'Obat sedang disiapkan oleh apoteker.', color: '#7c3aed', rank: 1 },

};

var S = {

};

// ===================== UTIL =====================
function $(id) { return document.getElementById(id); }
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rp(n) { return 'Rp' + Math.round(Number(n) || 0).toLocaleString('id-ID'); }
function val(id) { var el = $(id); return el ? String(el.value || '').trim() : ''; }
function toast(msg, type) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (type || '');
  clearTimeout(S.toastT); S.toastT = setTimeout(function () { t.className = 'toast'; }, 2800);
}
function call(fn, args, ok, fail) {
  args = Array.isArray(args) ? args : (args === null || args === undefined ? [] : [args]);
  var onFail = function (e) { var m = (e && e.message) ? e.message : String(e); if (fail) fail(m); else toast(m, 'err'); };
  var onOk = function (res) {
    if (res && res.relogin) { logout(true); toast(res.error || 'Sesi berakhir, silakan masuk lagi', 'err'); if (fail) fail(res.error); showView('auth'); return; }
    ok(res);
  };
  if (API_URL) {
    var tries = 0;
    var go = function () {
      fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(onOk)
        .catch(function (e) {
          if (!navigator.onLine) { onFail('Tidak ada koneksi internet. Periksa data/WiFi lalu coba lagi.'); return; }
          if (++tries < 2) { setTimeout(go, 1200); return; }
          onFail('Gagal terhubung ke server apotek. Coba lagi sebentar.');
        });
    };
    go(); return;
  }
  if (!isGAS) { setTimeout(function () { try { onOk(DEMO[fn].apply(null, args)); } catch (e) { onFail(e); } }, 350); return; }
  var r = google.script.run.withSuccessHandler(onOk).withFailureHandler(onFail);
  r[fn].apply(r, args);
}
function openWA(text) {
  var n = S.cfg.waNumber || '';
  if (!n) { toast('Nomor WhatsApp apotek belum diatur', 'err'); return; }
  window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(text || ''), '_blank');
}

// ===================== KATALOG =====================
function loadCatalog() {
  $('grid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  call('getStoreCatalog', null, function (res) {
    if (!res || !res.success) { showCatalogError(res && res.error); return; }
    S.cfg = res.config || {};
    S.products = res.products || [];
    S.map = {};
    S.products.forEach(function (p) { S.map[p.id] = p; if (p.photoUrl) S.photos[p.id] = p.photoUrl; });
    S.cart = S.cart.filter(function (l) { return S.map[l.id]; });
    saveCart();
    S.loaded = true;
    hideSplash();
    applyConfig(); renderCategories(); renderProducts(); updateBadge();
    if (S.view !== 'home') renderView(S.view);
    var sv = new URLSearchParams(location.search).get('v');
    if (sv && ['resep', 'orders', 'rutin', 'sehat', 'akun', 'wishlist', 'ajak', 'cart'].indexOf(sv) >= 0 && S.view === 'home') showView(sv);
    if (!API_URL) toast('Mode contoh: isi URL Web App di config.js', 'err');
    if (S.token && !S.rt) loadRoutine();
    if (S.token && !S.wish) loadWishlist();
    if (S.refParam && !S.token && S.view === 'home') { S.authTab = 'reg'; showView('auth'); toast('🎁 Anda diajak teman! Daftar sekarang & dapatkan bonus poin.'); }
  }, showCatalogError);
}
function showCatalogError(msg) {

    '<div class="banner b2" onclick="openScheduleSheet()"><b>Gratis Ongkir!</b><p>Alamat dalam radius ' + fmtKm(dv.radiusKm || 3) + ' km dari apotek, diantar sesuai jadwal antar apotek.</p><span class="pill">Lihat Jadwal Antar →</span><span class="big">🛵</span></div>',

function onBannerScroll() {
  var b = $('banners'); var w = b.firstElementChild ? b.firstElementChild.offsetWidth + 10 : 300;

function renderCategories() {
  var present = {};

  }, 220);

function clearSearch() { $('q').value = ''; onSearch(); }

function filtered() {
  var words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return S.products.filter(function (p) {
    if (S.cat !== 'Semua' && p.cat !== S.cat) return false;
    if (!words.length) return true;
    var t = (p.name + ' ' + (p.comp || '') + ' ' + p.cat).toLowerCase();
    return words.every(function (w) { return t.indexOf(w) >= 0; });
  }).sort(function (a, b) { return ((b.stock > 0) - (a.stock > 0)) || a.name.localeCompare(b.name); });
}
function defaultUnit(p) { return p.big ? 'BESAR' : 'KECIL'; }
function unitInfo(p, unit) {
  if (unit === 'BESAR' && p.big) return { unit: 'BESAR', label: 'Strip/Box isi ' + p.qps + ' ' + p.unit, short: 'Strip/Box', base: p.qps };
  return { unit: 'KECIL', label: p.unit, short: p.unit, base: 1 };
}
function findLine(id, unit) { for (var i = 0; i < S.cart.length; i++) if (S.cart[i].id === id && S.cart[i].unit === unit) return S.cart[i]; return null; }
function maxQty(p, unit) {
  var used = 0;
  S.cart.forEach(function (l) { if (l.id === p.id && l.unit !== unit) used += l.qty * unitInfo(p, l.unit).base; });
  return Math.max(0, Math.min(99, Math.floor((p.stock - used) / unitInfo(p, unit).base)));
}
function phHTML(p, big) {
  return '<span class="ph" style="background:' + (CAT_BG[p.cat] || '#eef2f4') + (big ? ';font-size:80px;width:auto;background:none' : '') + '">' + (CAT_ICON[p.cat] || '💊') + '</span>';
}
function imgHTML(p) { return S.photos[p.id] ? '<img src="' + S.photos[p.id] + '" alt="" loading="lazy">' : phHTML(p); }
function stockHTML(p, u) {
  if (p.stock < u.base) return '<div class="pstock out">Stok habis</div>';
  if (p.stock <= u.base * 3) return '<div class="pstock low">Sisa sedikit</div>';
  return '';
}
function actHTML(p) {
  var unit = defaultUnit(p), line = findLine(p.id, unit);
  if (p.stock < unitInfo(p, unit).base && !line) return '<button class="btn-add" disabled>Stok Habis</button>';
  if (line) return '<div class="step"><button onclick="addToCart(\'' + p.id + '\',\'' + unit + '\',-1)">−</button><span>' + line.qty + '</span><button onclick="addToCart(\'' + p.id + '\',\'' + unit + '\',1)">+</button></div>';
  return '<button class="btn-add" onclick="addToCart(\'' + p.id + '\',\'' + unit + '\',1)">+ Keranjang</button>';
}
function cardHTML(p) {
  var u = unitInfo(p, defaultUnit(p));
  return '<div class="pcard' + (p.stock < u.base ? ' out' : '') + '" onclick="openProduct(\'' + p.id + '\')">' +
    '<div class="pimg" data-pid="' + p.id + '">' + imgHTML(p) + (p.rx ? '<span class="tag rx">Perlu Resep</span>' : '') + heartHTML(p) + '</div>' +
    '<div class="pbody"><div class="pname">' + esc(p.name) + '</div><div class="punit">per ' + esc(u.short) + '</div>' +
    stockHTML(p, u) +
    '<div class="pact" id="act-' + p.id + '" onclick="event.stopPropagation()">' + actHTML(p) + '</div></div></div>';
}
function renderProducts() {
  if (!S.loaded) return;
  var list = filtered();
  $('prod-title').textContent = S.q ? 'Hasil untuk "' + S.q + '"' : (S.cat === 'Semua' ? 'Semua Produk' : S.cat);
  $('prod-count').textContent = list.length + ' produk';
  if (!list.length) {
    $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="e">🔎</div><b>Produk tidak ditemukan</b>Coba kata kunci lain, atau tanyakan langsung ke apoteker.<br><br><button class="btn btn-wa" onclick="openWA(\'Halo, apakah tersedia obat: ' + esc(S.q.replace(/['"\\]/g, '')) + '?\')">💬 Tanya via WhatsApp</button></div>';
    $('more').style.display = 'none';
    return;
  }
  var shown = list.slice(0, S.limit);
  $('grid').innerHTML = shown.map(cardHTML).join('');
  $('more').style.display = list.length > S.limit ? 'block' : 'none';
  requestPhotos(shown);
}
function requestPhotos(list) {
  var ids = list.filter(function (p) { return p.hasPhoto && !S.photos[p.id] && !S.photoReq[p.id]; }).map(function (p) { return p.id; }).slice(0, 40);
  if (!ids.length) return;
  ids.forEach(function (i) { S.photoReq[i] = 1; });
  call('getProductPhotos', [ids], function (res) {
    var m = (res && res.photos) || {};
    Object.keys(m).forEach(function (id) {
      S.photos[id] = m[id];
      Array.prototype.forEach.call(document.querySelectorAll('[data-pid="' + id + '"]'), function (el) {
        var tag = el.querySelector('.tag');
        el.innerHTML = '<img src="' + m[id] + '" alt="">' + (tag ? tag.outerHTML : '');
      });
    });
    if (S.sheet && m[S.sheet.id]) renderSheet();
  }, function () {});
}

// ===================== KERANJANG =====================
function saveCart() { lsSet('pf_toko_cart', S.cart); updateBadge(); }
function updateBadge() {
  var n = S.cart.reduce(function (s, l) { return s + l.qty; }, 0);
  var b = $('cart-badge'); b.textContent = n > 99 ? '99+' : n; b.className = 'badge' + (n ? ' show' : '');
}
function addToCart(id, unit, delta) {
  var p = S.map[id]; if (!p) return;
  var max = maxQty(p, unit), line = findLine(id, unit), cur = line ? line.qty : 0, nq = cur + delta;
  if (delta > 0 && nq > max) { toast(max <= 0 ? 'Stok tidak mencukupi' : 'Maksimal ' + max + ' ' + unitInfo(p, unit).short, 'err'); nq = max; }
  if (nq <= 0) S.cart = S.cart.filter(function (l) { return !(l.id === id && l.unit === unit); });
  else if (line) line.qty = nq;
  else { S.cart.push({ id: id, unit: unit, qty: nq }); toast('✓ ' + p.name + ' masuk keranjang'); }
  saveCart();
  var el = $('act-' + id); if (el) el.innerHTML = actHTML(p);
  if (S.view === 'cart') renderCart();
  if (S.view === 'cart' || S.view === 'checkout') requestQuote();
}
function cartKey() { return JSON.stringify(S.cart.map(function (l) { return [l.id, l.unit, l.qty]; })); }
function cartTotals() {
  var items = 0, rx = false;
  S.cart.forEach(function (l) {
    var p = S.map[l.id]; if (!p) return;
    items += l.qty; if (p.rx) rx = true;
  });
  var q = S.quote && S.quote.key === cartKey() && !S.quote.loading ? S.quote : null;
  var sub = q && q.sub !== undefined ? q.sub : null;
  var ong = ongkirFor();
  return { sub: sub, items: items, rx: rx, ongkir: ong, total: sub === null ? null : sub + ong };
}
/** Minta TOTAL belanja ke server (harga per obat tidak pernah dikirim ke HP) */
function requestQuote(force) {
  if (!S.cart.length) { S.quote = null; return; }
  if (!S.token) { S.quote = null; refreshTotalsUI(); return; }
  var key = cartKey();
  if (!force && S.quote && S.quote.key === key && (S.quote.loading || S.quote.sub !== undefined)) return;
  S.quote = { key: key, loading: true };
  refreshTotalsUI();
  clearTimeout(S.quoteT);
  S.quoteT = setTimeout(function () {
    call('getCartQuote', [S.token, S.cart.map(function (l) { return { id: l.id, unit: l.unit, qty: l.qty }; })], function (res) {
      if (!S.quote || S.quote.key !== key) return;
      if (!res || !res.success) { S.quote = { key: key, err: (res && res.error) || 'Gagal menghitung total' }; if (res && res.reload) loadCatalog(); }
      else S.quote = { key: key, sub: res.subtotal };
      refreshTotalsUI();
    }, function (m) { S.quote = { key: key, err: m }; refreshTotalsUI(); });
  }, 350);
}
function refreshTotalsUI() {
  var t = cartTotals();
  ['cart-summary', 'co-summary'].forEach(function (id) { var el = $(id); if (el) el.innerHTML = summaryHTML(t); });
  var cb = $('cart-cta'); if (cb) cb.innerHTML = 'Lanjut ke Pembayaran' + (t.total !== null ? ' • ' + rp(t.total) : '');
  var ep = $('co-est'); if (ep) ep.innerHTML = estPoints(t.sub) > 0 ? '<div class="alert ok" style="margin:10px 0 0"><span>⭐</span><span>Anda akan mendapat <b>±' + estPoints(t.sub) + ' poin</b> setelah pesanan selesai.</span></div>' : '';
}
function totalLabel(v) {
  if (v !== null && v !== undefined) return rp(v);
  if (!S.token) return '<button class="link-btn" onclick="requireLogin(S.view)">Masuk untuk melihat total</button>';
  if (S.quote && S.quote.err) return '<small style="color:var(--red)">' + esc(S.quote.err) + '</small>';
  return '<small style="color:var(--muted)">Menghitung...</small>';
}
function ongkirFor() {
  if (S.mode !== 'ANTAR') return 0;
  var st = dlStatus();
  return st.status === 'BAYAR' ? st.ongkir : 0;
}
function fmtKm(n) { return String(Math.round((Number(n) || 0) * 10) / 10).replace('.', ','); }
function summaryHTML(t) {
  var h = '<div class="sum-row"><span>Total belanja (' + t.items + ' barang)</span><span>' + totalLabel(t.sub) + '</span></div>';
  var ongLbl = 'Rp0';
  if (S.mode === 'ANTAR') {
    var st = dlStatus();
    ongLbl = st.status === 'GRATIS' ? '<b style="color:var(--brand)">GRATIS</b>'
      : st.status === 'BAYAR' ? rp(st.ongkir)
      : st.status === 'KONFIRMASI' ? '<small style="color:var(--accent);font-weight:700">Dikonfirmasi apotek</small>'
      : '<small style="color:var(--muted)">Dicek saat checkout</small>';
  }
  h += '<div class="sum-row"><span>' + (S.mode === 'ANTAR' ? 'Ongkos kirim' : 'Ambil di apotek') + '</span><span>' + ongLbl + '</span></div>';
  h += '<div class="sum-row total"><span>Total Bayar</span><span>' + totalLabel(t.total) + '</span></div>';
  return h;
}
function renderCart() {
  var v = $('view-cart');
  if (!S.cart.length) {
    v.innerHTML = '<div class="empty"><div class="e">🛒</div><b>Keranjang masih kosong</b>Yuk cari obat, vitamin, atau alat kesehatan yang Anda butuhkan.<br><br><button class="btn btn-primary" onclick="showView(\'home\')">Mulai Belanja</button></div>';
    return;
  }
  var t = cartTotals(), c = S.cfg;
  var lines = S.cart.map(function (l) {
    var p = S.map[l.id]; if (!p) return '';
    var u = unitInfo(p, l.unit);
    return '<div class="cline"><div class="th">' + (S.photos[p.id] ? '<img src="' + S.photos[p.id] + '">' : (CAT_ICON[p.cat] || '💊')) + '</div>' +
      '<div class="inf"><div class="nm">' + esc(p.name) + (p.rx ? ' <span style="color:var(--accent);font-size:11px">• Perlu resep</span>' : '') + '</div>' +
      '<div class="un">' + esc(u.label) + '</div>' +
      '<div class="ctl"><div class="qty"><button onclick="addToCart(\'' + p.id + '\',\'' + l.unit + '\',-1)">−</button><span>' + l.qty + '</span><button onclick="addToCart(\'' + p.id + '\',\'' + l.unit + '\',1)">+</button></div>' +
      '<div style="text-align:right"><button class="del" onclick="addToCart(\'' + p.id + '\',\'' + l.unit + '\',-999)">Hapus</button></div></div></div></div>';
  }).join('');
  var free = S.mode === 'ANTAR' ? '<div class="alert ok" style="cursor:pointer" onclick="openScheduleSheet()"><span>🛵</span><span><b>Gratis ongkir</b> untuk alamat dalam radius ' + fmtKm((c.delivery || {}).radiusKm || 3) + ' km dari apotek & diantar sesuai jadwal antar. Jarak dicek saat checkout. <u>Lihat jadwal</u></span></div>' : '';
  v.innerHTML =
    '<div class="sec-head" style="margin-top:4px"><h2>Keranjang Saya</h2><span>' + t.items + ' barang</span></div>' +
    '<div class="card"><div class="seg">' + modeSegHTML() + '</div></div>' + free +
    (t.rx ? '<div class="alert warn"><span>📋</span><span>Keranjang berisi <b>obat yang memerlukan resep dokter</b>. Anda akan diminta mengunggah foto resep saat checkout.</span></div>' : '') +
    '<div class="card" style="padding:4px 14px">' + lines + '</div>' +
    '<div class="card"><div id="cart-summary">' + summaryHTML(t) + '</div><div style="font-size:11.5px;color:var(--muted);margin-top:6px">🔒 Harga per item dikonfirmasi apotek; Anda cukup melihat total belanja.</div></div>' +
    '<div class="sticky-cta"><button class="btn btn-primary" id="cart-cta" onclick="showView(\'checkout\')">Lanjut ke Pembayaran' + (t.total !== null ? ' • ' + rp(t.total) : '') + '</button></div>';
  requestQuote();
}
function modeSegHTML() {
  return '<button class="' + (S.mode === 'ANTAR' ? 'active' : '') + '" onclick="setMode(\'ANTAR\')"><b>🛵 Diantar</b></button>' +
    '<button class="' + (S.mode === 'AMBIL' ? 'active' : '') + '" onclick="setMode(\'AMBIL\')"><b>🏪 Ambil Sendiri</b></button>';
}
function setMode(m, silent) {
  S.mode = m === 'AMBIL' ? 'AMBIL' : 'ANTAR';
  lsSet('pf_toko_mode', S.mode);
  Array.prototype.forEach.call(document.querySelectorAll('#mode-top button'), function (b) { b.className = b.getAttribute('data-mode') === S.mode ? 'active' : ''; });
  if (silent) return;
  if (S.view === 'cart') renderCart();
  if (S.view === 'checkout' || S.view === 'resep') {
    Array.prototype.forEach.call(document.querySelectorAll('.form-mode button'), function (b) { b.className = b.getAttribute('data-mode') === S.mode ? 'active' : ''; });
    Array.prototype.forEach.call(document.querySelectorAll('.addr-wrap'), function (w) { w.style.display = S.mode === 'ANTAR' ? '' : 'none'; });
    var cs = $('co-summary'); if (cs) cs.innerHTML = summaryHTML(cartTotals());
    dlRefreshUI();
    if (S.mode === 'ANTAR') dlAutoCheck(S.view === 'resep' ? 'rx' : 'co');

// ===================== PENGANTARAN: JARAK & JADWAL =====================
function dlCfg() { return S.cfg.delivery || { radiusKm: 3, ongkirOut: 0, maxKm: 0, leadMin: 60, allowOff: true, slots: [], schedule: [] }; }
function dlStatus() {
  var d = dlCfg(), km = S.dlv.km, slot = S.dlv.slot;
  if (km === null || km === undefined) return { status: '' };
  if (d.maxKm > 0 && km > d.maxKm) return { status: 'DITOLAK' };
  var inRadius = km <= d.radiusKm, onSched = !!slot && slot !== 'LUAR JADWAL';
  if (inRadius && onSched) return { status: 'GRATIS', ongkir: 0, inRadius: true };
  if (inRadius && !slot) return { status: '', inRadius: true };
  return { status: d.ongkirOut > 0 ? 'BAYAR' : 'KONFIRMASI', ongkir: d.ongkirOut, inRadius: inRadius };
}
function dlSlotLabel(id) {
  if (!id) return '-';
  if (id === 'LUAR JADWAL') return 'Di luar jadwal (secepatnya)';
  var f = (dlCfg().slots || []).filter(function (x) { return x.id === id; })[0];
  if (f) return f.label;
  var m = String(id).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})-(\d{2}):(\d{2})$/);
  if (!m) return id;
  var bln = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return Number(m[3]) + ' ' + bln[Number(m[2]) - 1] + ' • ' + m[4] + '.' + m[5] + '–' + m[6] + '.' + m[7];
}
function dlSlotSelectHTML(prefix) {
  var d = dlCfg(), slots = d.slots || [];
  if (S.dlv.slot && S.dlv.slot !== 'LUAR JADWAL' && !slots.some(function (x) { return x.id === S.dlv.slot; })) S.dlv.slot = '';
  var opts = '<option value="">— Pilih jadwal antar —</option>' + slots.map(function (x) {
    return '<option value="' + esc(x.id) + '"' + (x.id === S.dlv.slot ? ' selected' : '') + '>' + esc(x.label) + '</option>';
  }).join('') + (d.allowOff ? '<option value="LUAR JADWAL"' + (S.dlv.slot === 'LUAR JADWAL' ? ' selected' : '') + '>Di luar jadwal (secepatnya) — ongkir tidak gratis</option>' : '');
  return '<select id="' + prefix + '-slot" onchange="dlPickSlot(this.value)">' + opts + '</select>' +
    (slots.length ? '' : '<div style="font-size:12px;color:var(--accent);margin-top:4px">Belum ada jadwal antar terdekat.</div>') +
    '<button type="button" class="link-btn" onclick="openScheduleSheet()">🗓️ Lihat jadwal antar & ketentuan gratis ongkir</button>';
}
function dlBoxHTML(prefix) {
  var d = dlCfg(), v = S.dlv, st = dlStatus();
  if (v.loading) return '<div class="dlst info"><span>⏳</span><span>Menghitung jarak dari apotek...</span></div>';
  if (v.err) return '<div class="dlst warn"><span>⚠️</span><span>' + esc(v.err) + '<br><button type="button" class="link-btn" onclick="dlCheck(\'' + prefix + '\')">Coba cek lagi</button></span></div>';
  if (v.km === null || v.km === undefined) {
    return '<div class="dlst info"><span>📏</span><span>Gratis ongkir untuk jarak ≤ <b>' + fmtKm(d.radiusKm) + ' km</b> dari apotek & sesuai jadwal antar.<br><button type="button" class="link-btn" onclick="dlCheck(\'' + prefix + '\')">📏 Cek jarak & ongkir</button></span></div>';
  }
  var src = v.src === 'GPS' ? 'dari titik lokasi Anda' : 'perkiraan dari alamat — gunakan titik lokasi agar lebih akurat';
  var kmTxt = 'Jarak ±<b>' + fmtKm(v.km) + ' km</b> (' + src + ').';
  if (st.status === 'DITOLAK') return '<div class="dlst warn"><span>🚫</span><span>' + kmTxt + ' Di luar jangkauan pengantaran (maks. ' + fmtKm(d.maxKm) + ' km). Silakan pilih <b>Ambil Sendiri</b>.</span></div>';
  if (st.status === 'GRATIS') return '<div class="dlst ok"><span>✅</span><span><b>GRATIS ONGKIR</b> — ' + kmTxt + ' Diantar: ' + esc(dlSlotLabel(v.slot)) + '.</span></div>';
  if (st.status === '' && st.inRadius) return '<div class="dlst ok"><span>✅</span><span>' + kmTxt + ' Masuk radius gratis ongkir. <b>Pilih jadwal antar</b> di atas.</span></div>';
  var why = !st.inRadius ? 'melebihi ' + fmtKm(d.radiusKm) + ' km' : 'di luar jadwal antar apotek';
  return '<div class="dlst warn"><span>🛵</span><span>' + kmTxt + ' Tidak gratis ongkir (' + why + '). ' +
    (st.status === 'BAYAR' ? 'Ongkir <b>' + rp(st.ongkir) + '</b>.' : 'Ongkir akan <b>dikonfirmasi apotek</b> via WhatsApp.') + '</span></div>';
}
function dlRefreshUI() {
  ['co', 'rx'].forEach(function (p) { var b = $(p + '-dlbox'); if (b) b.innerHTML = dlBoxHTML(p); });
  var cs = $('co-summary'); if (cs) cs.innerHTML = summaryHTML(cartTotals());
  var rs = $('rx-ongkir'); if (rs) rs.innerHTML = rxOngkirText();
}
function dlPickSlot(v) { S.dlv.slot = v; dlRefreshUI(); }
function dlAddrChanged(prefix) {
  var addr = val(prefix + '-addr');
  if (S.dlv.geo && addr.indexOf('Titik lokasi:') < 0) S.dlv.geo = null;
  S.dlv.km = null; S.dlv.err = '';
  if (addr.length >= 10 || S.dlv.geo) dlCheck(prefix); else dlRefreshUI();
}
function dlCheck(prefix) {
  if (!S.token) { requireLogin(S.view); return; }
  var addr = val(prefix + '-addr');
  if (!S.dlv.geo && addr.length < 10) { S.dlv.err = 'Isi alamat lengkap atau gunakan titik lokasi untuk menghitung jarak.'; dlRefreshUI(); return; }
  S.dlv.loading = true; S.dlv.err = ''; dlRefreshUI();
  call('quoteDelivery', [S.token, { geo: S.dlv.geo, address: addr, slot: S.dlv.slot }], function (res) {
    S.dlv.loading = false;
    if (!res || !res.success) { S.dlv.err = (res && res.error) || 'Gagal menghitung jarak'; dlRefreshUI(); return; }
    var q = res.quote || {};
    S.dlv.km = q.km; S.dlv.method = q.method; S.dlv.src = q.src;
    if (q.km === null || q.km === undefined) S.dlv.err = 'Alamat belum ditemukan di peta. Tekan "📍 Gunakan titik lokasi saya" agar jarak bisa dihitung.';
    dlRefreshUI();
  }, function (m) { S.dlv.loading = false; S.dlv.err = m; dlRefreshUI(); });
}
function dlAutoCheck(prefix) {
  if (!S.token || S.mode !== 'ANTAR' || S.dlv.loading) return;
  if (S.dlv.km !== null && S.dlv.km !== undefined) { dlRefreshUI(); return; }
  if (S.dlv.geo || val(prefix + '-addr').length >= 10) dlCheck(prefix);
}
function openScheduleSheet() {
  var d = dlCfg();

  var rows = (d.schedule || []).slice(1).concat((d.schedule || []).slice(0, 1)).map(function (x) {
    return '<tr><td>' + esc(x.day) + '</td><td>' + (x.slots.length ? x.slots.map(function (s) { return '<span class="chip">' + esc(s.replace('-', '–').replace(/:/g, '.')) + '</span>'; }).join('') : '<span class="off">Tidak ada pengantaran</span>') + '</td></tr>';
  }).join('');
  $('sheet-body').innerHTML = '<h2 style="font-size:18px;font-weight:800">🛵 Jadwal Antar & Gratis Ongkir</h2>' +
    '<div class="alert ok" style="margin:10px 0"><span>🎁</span><span><b>GRATIS ONGKIR</b> untuk alamat berjarak tempuh ≤ <b>' + fmtKm(d.radiusKm) + ' km</b> dari apotek dan diantar pada jadwal antar di bawah.</span></div>' +
    '<div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">' +
    '• Pesan paling lambat <b>' + (d.leadMin || 0) + ' menit</b> sebelum jadwal antar dimulai.<br>' +
    '• Di luar radius atau di luar jadwal: ' + (d.ongkirOut > 0 ? 'ongkir <b>' + rp(d.ongkirOut) + '</b>.' : 'ongkir <b>dikonfirmasi apotek</b> via WhatsApp.') + '<br>' +
    (d.maxKm > 0 ? '• Jangkauan antar maksimal <b>' + fmtKm(d.maxKm) + ' km</b>.<br>' : '') +
    '• Gunakan <b>titik lokasi</b> saat checkout agar jarak dihitung akurat.</div>' +
    '<table class="sched">' + rows + '</table>' +
    '<button class="btn btn-ghost" style="margin-top:14px" onclick="closeSheet()">Tutup</button>';
  $('sheet').classList.add('open'); $('sheet-bg').classList.add('open');
}

// ===================== DETAIL PRODUK (SHEET) =====================
function openProduct(id) {
  var p = S.map[id]; if (!p) return;
  S.sheet = { id: id, unit: defaultUnit(p), qty: 1 };
  renderSheet();
  $('sheet').classList.add('open'); $('sheet-bg').classList.add('open');
  requestPhotos([p]);
}
function closeSheet() { $('sheet').classList.remove('open'); $('sheet-bg').classList.remove('open'); S.sheet = null; }
function renderSheet() {
  var s = S.sheet; if (!s) return;
  var p = S.map[s.id], u = unitInfo(p, s.unit), max = maxQty(p, s.unit);
  if (s.qty > max) s.qty = Math.max(1, max);
  var units = '';
  if (p.big) {
    units = '<div class="units">' + ['KECIL', 'BESAR'].map(function (k) {
      var ui = unitInfo(p, k);
      return '<button class="' + (s.unit === k ? 'active' : '') + '" onclick="S.sheet.unit=\'' + k + '\';S.sheet.qty=1;renderSheet()"><b>' + esc(ui.label) + '</b><small>Beli per ' + esc(ui.short) + '</small></button>';
    }).join('') + '</div>';
  }
  var line = findLine(p.id, s.unit);
  $('sheet-body').innerHTML =
    '<div class="sh-img">' + (S.photos[p.id] ? '<img src="' + S.photos[p.id] + '">' : (CAT_ICON[p.cat] || '💊')) + '</div>' +
    '<div style="margin-top:12px;font-size:12px;color:var(--brand);font-weight:700">' + esc(p.cat) + '</div>' +
    '<div style="display:flex;gap:10px;align-items:flex-start;margin-top:2px"><h2 style="flex:1;font-size:18px;font-weight:800;line-height:1.3">' + esc(p.name) + '</h2>' +
    '<button class="sh-fav' + (wishOf(p.id) && wishOf(p.id).fav ? ' on' : '') + '" onclick="toggleFav(\'' + p.id + '\')">' + (wishOf(p.id) && wishOf(p.id).fav ? '♥ Tersimpan' : '♡ Wishlist') + '</button></div>' +
    (p.comp ? '<div style="font-size:12.5px;color:var(--ink-2);margin-top:4px">🧪 Kandungan: ' + esc(p.comp) + '</div>' : '') +
    '<div style="font-size:13px;color:var(--ink-2);margin-top:8px">Dijual per <b>' + esc(u.label) + '</b> • total belanja tampil di keranjang</div>' +
    stockHTML(p, u) + units +
    (p.rx ? '<div class="alert warn" style="margin-top:10px"><span>📋</span><span>Obat ini <b>wajib dengan resep dokter</b>. Siapkan foto resep saat checkout. Apoteker akan memverifikasi sebelum obat diserahkan.</span></div>' : '<div class="alert info" style="margin-top:10px"><span>💡</span><span>Baca aturan pakai pada kemasan. Jika gejala berlanjut, hubungi dokter.</span></div>') +
    (line ? '<div style="font-size:12.5px;color:var(--brand-d);font-weight:700;margin-bottom:8px">✓ Sudah ada ' + line.qty + ' di keranjang</div>' : '') +
    (max > 0
      ? '<div style="display:flex;gap:10px;align-items:center"><div class="qty" style="height:48px"><button style="width:44px" onclick="S.sheet.qty=Math.max(1,S.sheet.qty-1);renderSheet()">−</button><span style="min-width:34px">' + s.qty + '</span><button style="width:44px" onclick="S.sheet.qty=Math.min(' + max + ',S.sheet.qty+1);renderSheet()">+</button></div>' +
        '<button class="btn btn-primary" style="flex:1" onclick="addToCart(S.sheet.id,S.sheet.unit,S.sheet.qty);closeSheet()">+ Tambah ke Keranjang</button></div>'
      : ((wishOf(p.id) && wishOf(p.id).notify)
          ? '<div class="alert ok"><span>🔔</span><span>Anda akan dikabari saat <b>stok tersedia</b>. <button class="link-btn" onclick="toggleNotify(\'' + p.id + '\')">Batalkan</button></span></div>'
          : '<button class="btn btn-primary" onclick="toggleNotify(\'' + p.id + '\')">🔔 Kabari Saya Saat Stok Ada</button>') +
        '<button class="btn btn-ghost" onclick="openWA(\'Halo, apakah ' + esc(p.name.replace(/['"\\]/g, '')) + ' tersedia lagi?\')">💬 Tanya via WhatsApp</button>');
}

function customerFormHTML(prefix) {
  var a = S.me || {};
  return '<div class="field"><label>Nama Penerima *</label><input id="' + prefix + '-name" value="' + esc(a.name || '') + '" placeholder="Nama lengkap"></div>' +
    '<div class="field"><label>No. HP / WhatsApp Member</label><input id="' + prefix + '-phone" type="tel" value="' + esc(a.phone || '') + '" readonly style="background:#f3f6f8;color:var(--ink-2)"></div>' +
    '<div class="field"><label>Cara Terima Pesanan</label><div class="seg form-mode">' +
    '<button type="button" data-mode="ANTAR" class="' + (S.mode === 'ANTAR' ? 'active' : '') + '" onclick="setMode(\'ANTAR\')"><b>🛵 Diantar</b></button>' +
    '<button type="button" data-mode="AMBIL" class="' + (S.mode === 'AMBIL' ? 'active' : '') + '" onclick="setMode(\'AMBIL\')"><b>🏪 Ambil Sendiri</b></button></div></div>' +
    '<div class="field addr-wrap" style="' + (S.mode === 'ANTAR' ? '' : 'display:none') + '"><label>Alamat Pengantaran *</label>' +
    '<textarea id="' + prefix + '-addr" placeholder="Nama jalan, no. rumah, RT/RW, kelurahan, patokan" onchange="dlAddrChanged(\'' + prefix + '\')">' + esc(a.address || '') + '</textarea>' +
    '<button type="button" class="link-btn" onclick="useLocation(\'' + prefix + '-addr\')">📍 Gunakan titik lokasi saya saat ini (paling akurat)</button></div>' +
    '<div class="field addr-wrap" style="' + (S.mode === 'ANTAR' ? '' : 'display:none') + '"><label>Jadwal Antar *</label>' + dlSlotSelectHTML(prefix) +
    '<div class="dlbox" id="' + prefix + '-dlbox">' + dlBoxHTML(prefix) + '</div></div>';
}
function readCustomer(prefix) { return { name: val(prefix + '-name'), phone: (S.me || {}).phone || '', address: val(prefix + '-addr') }; }
function validateCustomer(c) {
  if (c.name.length < 2) return 'Isi nama penerima';
  if (S.mode === 'ANTAR' && c.address.length < 10) return 'Isi alamat pengantaran dengan lengkap';
  return '';
}
function useLocation(id) {
  if (!navigator.geolocation) { toast('Perangkat tidak mendukung lokasi', 'err'); return; }
  toast('Mengambil lokasi...');
  navigator.geolocation.getCurrentPosition(function (pos) {
    var el = $(id); if (!el) return;
    var link = 'https://maps.google.com/?q=' + pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6);
    el.value = (el.value ? el.value.replace(/\n?Titik lokasi: .*$/, '') + '\n' : '') + 'Titik lokasi: ' + link;
    S.dlv.geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    toast('✓ Titik lokasi ditambahkan, menghitung jarak...');
    dlCheck(id.split('-')[0]);
  }, function () { toast('Izin lokasi ditolak. Tulis alamat secara manual.', 'err'); }, { enableHighAccuracy: true, timeout: 10000 });
}

function payList() { return S.cfg.payments || [{ id: 'COD', jenis: 'COD', label: 'COD — Bayar di Tempat', desc: 'Tunai / QRIS saat pesanan diterima' }]; }
function payById(id) { var l = payList(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return l[l.length - 1]; }
function payIcon(p) { return p.jenis === 'QRIS' ? '🔳' : p.jenis === 'COD' ? '💵' : '🏦'; }
function paymentHTML(prefix) {
  return payList().map(function (p, i) {
    var det = p.jenis === 'TRANSFER' ? 'No. Rek <b>' + esc(p.norek) + '</b> a.n. ' + esc(p.atasNama)
      : p.jenis === 'QRIS' ? 'Scan QRIS ' + esc(p.merchant) + ' • NMID ' + esc(p.nmid)
      : esc(p.desc || 'Bayar saat pesanan diterima / diambil');
    return '<label class="radio' + (i === 0 ? ' active' : '') + '" onclick="selPay(this)"><input type="radio" name="' + prefix + '-pay" value="' + esc(p.id) + '"' + (i === 0 ? ' checked' : '') + '>' +
      '<span><b>' + payIcon(p) + ' ' + esc(p.label) + '</b><small>' + det + '</small></span></label>';
  }).join('') +
  '<div class="alert info" style="margin:6px 0 0"><span>📎</span><span>Untuk <b>Transfer & QRIS</b>: setelah membayar, <b>wajib unggah bukti transfer</b> di halaman berikutnya atau di menu Pesanan.</span></div>';
}
function selPay(el) {
  Array.prototype.forEach.call(el.parentNode.querySelectorAll('.radio'), function (r) { r.className = 'radio'; });
  el.className = 'radio active';
}
function getPay(prefix) { var el = document.querySelector('input[name="' + prefix + '-pay"]:checked'); return el ? el.value : 'COD'; }
function copyText(t, label) {
  function ok() { toast('✓ ' + (label || 'Teks') + ' disalin'); }
  try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { toast('Salin manual: ' + t); }
    ta.remove();
  }
}
var PAY_ST = {
  'COD': { t: 'COD — bayar saat diterima', c: '#475569', bg: '#eef2f4' },
  'BELUM BAYAR': { t: 'Belum dibayar', c: '#b45309', bg: '#fff3e3' },
  'MENUNGGU VERIFIKASI': { t: 'Bukti dikirim — menunggu verifikasi apotek', c: '#1d4ed8', bg: '#eaf1ff' },
  'LUNAS': { t: 'LUNAS — pembayaran terverifikasi', c: '#047857', bg: '#e6f6f0' },
  'DITOLAK': { t: 'Bukti ditolak — mohon unggah ulang', c: '#b91c1c', bg: '#fdecec' }
};
/** Panel instruksi bayar (dipakai di halaman sukses & kartu pesanan) */
function payPanelHTML(no, payId, amount, payStatus, canPay, payNote) {
  var p = payById(payId);
  var st = PAY_ST[payStatus] || PAY_ST['BELUM BAYAR'];
  var h = '<div class="paybox"><div class="payhead"><b>' + payIcon(p) + ' ' + esc(p.label) + '</b><span class="paystat" style="color:' + st.c + ';background:' + st.bg + '">' + esc(st.t) + '</span></div>';
  if (payNote && payStatus === 'DITOLAK') h += '<div style="font-size:12px;color:#b91c1c;margin-top:6px">Catatan apotek: ' + esc(payNote) + '</div>';
  if (p.jenis !== 'COD' && payStatus !== 'LUNAS') {
    if (!canPay) {
      h += '<div style="font-size:12.5px;color:var(--ink-2);margin-top:8px">💡 Lakukan pembayaran <b>setelah apotek mengonfirmasi total harga</b>. Tombol bayar akan muncul di sini.</div>';
    } else {
      if (amount) h += '<div class="payamt"><span>Jumlah transfer</span><b>' + rp(amount) + '</b><button class="link-btn" onclick="copyText(\'' + Math.round(amount) + '\',\'Nominal\')">Salin</button></div>';
      if (p.jenis === 'TRANSFER') {
        h += '<div class="payrek"><div><small>Bank ' + esc(p.bank) + '</small><b>' + esc(p.norek) + '</b><small>a.n. ' + esc(p.atasNama) + '</small></div>' +
          '<button class="btn-add" style="width:auto;padding:0 14px" onclick="copyText(\'' + esc(p.norek) + '\',\'No. rekening\')">Salin No. Rek</button></div>';
      } else if (p.jenis === 'QRIS') {
        h += '<div class="payqr" onclick="openQrisSheet(' + (amount || 0) + ')"><img src="' + QRIS_IMG + '" alt="QRIS"><div><b>Ketuk untuk memperbesar QRIS</b><small>Scan dengan m-banking / e-wallet, masukkan nominal ' + (amount ? rp(amount) : 'sesuai total') + '</small></div></div>';
      }
      h += '<button class="btn btn-primary" style="margin-top:10px;height:46px;font-size:14px" onclick="pickProof(\'' + esc(no) + '\')">📤 ' + (payStatus === 'MENUNGGU VERIFIKASI' ? 'Ganti Bukti Transfer' : 'Unggah Bukti Transfer') + '</button>';
    }
  }
  return h + '</div>';
}
function openQrisSheet(amount) {
  S.sheet = null;
  var q = payList().filter(function (p) { return p.jenis === 'QRIS'; })[0] || {};
  $('sheet-body').innerHTML = '<div style="text-align:center"><h2 style="font-size:18px;font-weight:800">🔳 Bayar dengan QRIS</h2>' +
    '<p style="font-size:12.5px;color:var(--ink-2);margin:4px 0 10px">' + esc(q.merchant || '') + ' • NMID ' + esc(q.nmid || '') + (amount ? '<br>Nominal: <b>' + rp(amount) + '</b>' : '') + '</p>' +
    '<img src="' + QRIS_IMG + '" alt="QRIS" style="width:100%;max-width:420px;border-radius:12px;border:1px solid var(--line)">' +
    '<p style="font-size:12px;color:var(--muted);margin-top:8px">Scan pakai aplikasi m-banking / e-wallet apa saja. Bisa juga tekan lama gambar untuk menyimpan, lalu unggah di aplikasi pembayaran.</p>' +
    '<a class="btn btn-ghost" style="margin-top:8px;text-decoration:none" href="' + QRIS_IMG + '" download="QRIS-Apotek-JOJO.jpg">⬇️ Simpan Gambar QRIS</a>' +
    '<button class="btn btn-ghost" onclick="closeSheet()">Tutup</button></div>';
  $('sheet').classList.add('open'); $('sheet-bg').classList.add('open');
}
function pickProof(no) {
  S.proofOrder = no;
  var el = $('file-proof'); el.value = ''; el.click();
}
function onProofFile(ev) {
  var f = ev.target.files && ev.target.files[0]; if (!f || !S.proofOrder) return;
  toast('Memproses bukti transfer...');
  compressImage(f, function (dataUrl) {
    var no = S.proofOrder;
    toast('Mengunggah bukti transfer...');
    call('uploadPaymentProof', [S.token, no, dataUrl], function (res) {
      if (!res || !res.success) { toast((res && res.error) || 'Gagal mengunggah bukti', 'err'); return; }
      toast('✅ Bukti transfer terkirim. Apotek akan memverifikasi.');
      if (S.lastOrder && S.lastOrder.orderNo === no) { S.lastOrder.payStatus = 'MENUNGGU VERIFIKASI'; if (S.view === 'success') renderSuccess(); }
      if (S.myOrders) applyOrderUpdate(res.order);
    });
  });
}


function uploadHTML(prefix, required) {
  var img = S.resepImg[prefix];
  if (img) {
    return '<div class="upload"><div class="upload-prev"><img src="' + img + '"><div style="flex:1"><b style="color:var(--brand-d)">✓ Foto resep siap dikirim</b><small>Pastikan tulisan resep terbaca jelas.</small><br><button type="button" class="link-btn" onclick="pickResep(\'' + prefix + '\',\'gal\')">Ganti foto</button> · <button type="button" class="link-btn" style="color:var(--red)" onclick="S.resepImg.' + prefix + '=null;refreshUpload(\'' + prefix + '\')">Hapus</button></div></div></div>';
  }
  return '<div class="upload"><div class="e">📄</div><b>Unggah Foto Resep Dokter' + (required ? ' *' : '') + '</b><small>Foto seluruh lembar resep dengan jelas (nama dokter, tanggal & tulisan obat terbaca)</small>' +
    '<div class="row"><button type="button" class="solid" onclick="pickResep(\'' + prefix + '\',\'cam\')">📷 Kamera</button><button type="button" onclick="pickResep(\'' + prefix + '\',\'gal\')">🖼️ Galeri</button></div></div>';
}
function refreshUpload(prefix) { var w = $(prefix + '-upload'); if (w) w.innerHTML = uploadHTML(prefix, true); }
function pickResep(prefix, src) { S.resepTarget = prefix; var el = $(src === 'cam' ? 'file-cam' : 'file-gal'); el.value = ''; el.click(); }
function onResepFile(ev) {
  var f = ev.target.files && ev.target.files[0]; if (!f) return;
  toast('Memproses foto...');
  compressImage(f, function (dataUrl) { S.resepImg[S.resepTarget] = dataUrl; refreshUpload(S.resepTarget); toast('✓ Foto resep ditambahkan'); });
}
function compressImage(file, cb) {
  var r = new FileReader();
  r.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = function () { toast('Gagal membaca gambar', 'err'); };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}

function doLogin() {

  setBusy('li-btn', true, 'Memeriksa...');
  call('loginMember', [{ phone: phone, pin: pin }], function (res) {
    setBusy('li-btn', false);
    if (!res || !res.success) { toast((res && res.error) || 'Gagal masuk', 'err'); return; }
    setSession(res);
    toast('Selamat datang, ' + res.member.name + '!');
    afterAuth();
  }, function (m) { setBusy('li-btn', false); toast(m, 'err'); });
}
function doRegister() {
  var d = { name: val('rg-name'), phone: val('rg-phone'), pin: val('rg-pin'), pin2: val('rg-pin2'), birth: val('rg-birth'), sex: val('rg-sex'), address: val('rg-addr'), ref: val('rg-ref').toUpperCase() };
  if (d.name.length < 2) { toast('Isi nama lengkap', 'err'); return; }
  if (!d.sex) { toast('Pilih jenis kelamin', 'err'); return; }
  var digits = d.phone.replace(/\D/g, '');
  if (digits.length < 10 || digits.length > 15) { toast('Nomor HP tidak valid', 'err'); return; }
  if (!/^\d{6}$/.test(d.pin)) { toast('PIN harus 6 angka', 'err'); return; }
  if (d.pin !== d.pin2) { toast('Ulangi PIN tidak sama', 'err'); return; }
  if (!$('rg-ok').checked) { toast('Centang persetujuan terlebih dahulu', 'err'); return; }
  setBusy('rg-btn', true, 'Mendaftarkan...');
  call('registerMember', [d], function (res) {
    setBusy('rg-btn', false);
    if (!res || !res.success) { toast((res && res.error) || 'Pendaftaran gagal', 'err'); return; }
    setSession(res);
    toast('🎉 Selamat! Anda resmi jadi member' + (res.bonus ? ' (+' + res.bonus + ' poin)' : ''));
    S.pending = S.pending || 'akun';
    afterAuth();
  }, function (m) { setBusy('rg-btn', false); toast(m, 'err'); });
}
function afterAuth() {
  S.rt = null; loadRoutine();
  S.wish = null; loadWishlist();
  var next = S.pending || 'akun';
  S.pending = null;
  if (next === 'checkout' && !S.cart.length) next = 'akun';
  showView(next);
}

function renderView(v) {

  else if (v === 'ajak') { S.ref = null; renderAjak(); }
  else if (v === 'rutin') { S.rtMode = 'list'; S.rtEdit = null; renderRutin(); if (S.rt) loadRoutine(); }
  else if (v === 'sehat') { S.hlMode = 'list'; S.hlEdit = null; renderSehat(); if (S.health) loadHealth(); }
  else if (v === 'orders') { renderOrders(); refreshOrders(false); }
  else if (v === 'akun') { renderAkun(); loadDashboard(); }

function showView(v) {
  closeSheet();
  if (['checkout', 'orders', 'akun', 'poin', 'sehat', 'rutin', 'wishlist', 'ajak'].indexOf(v) >= 0 && !S.token) { S.pending = v; v = 'auth'; }
  if (v === 'auth' && S.token) v = 'akun';
  S.view = v;
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function (el) { el.classList.toggle('active', el.id === 'view-' + v); });
  var navKey = { checkout: 'cart', success: 'orders', poin: 'akun', auth: 'akun' }[v] || v;
  Array.prototype.forEach.call(document.querySelectorAll('.bnav button'), function (b) { b.classList.toggle('active', b.getAttribute('data-nav') === navKey); });
  document.body.classList.toggle('home', v === 'home');
  var titles = { cart: 'Keranjang', checkout: 'Checkout', resep: 'Tebus Resep', sehat: 'Catatan Kesehatan', rutin: 'Obat Rutin & Pengingat', wishlist: 'Wishlist Saya', ajak: 'Ajak Teman', orders: 'Pesanan Saya', akun: 'Kartu Member', poin: 'Poin & Hadiah', auth: 'Masuk / Daftar Member', success: 'Pesanan Terkirim' };
  if (v === 'home') { $('store-name').textContent = S.cfg.name || 'Apotek'; $('store-tag').textContent = S.cfg.tagline || ''; }
  else { $('store-name').textContent = titles[v] || ''; $('store-tag').textContent = S.cfg.name || ''; }
  renderView(v);
